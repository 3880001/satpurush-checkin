<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Check-In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
    }
    .header {
      text-align: center;
      margin-top: 20px;
    }
    .header img {
      width: 120px;
      border-radius: 12px;
    }
    .app {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin-bottom: 12px;
      color: #1c1c1e;
      font-size: 22px;
    }
    p {
      margin-bottom: 16px;
      color: #3a3a3c;
      font-size: 15px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #d1d1d6;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: #0a84ff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .error {
      color: #ff3b30;
      margin-top: 8px;
      font-size: 14px;
    }
    .admin-btn {
      margin-top: 20px;
      background: #333 !important;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: left;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://assets.brandfetch.io/baps.org/logo.png?format=png&size=400" />
  </div>

  <div class="app">
    <div class="card" id="card"></div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL = "https://unbzinjcrnniaqjbnjcb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4x-VTWA2nSW-toJxFIkpiw_ZFhCb7bA";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = {
      step: "phone",
      phone: "",
      name: "",
      loading: false,
      error: ""
    };

    let welcomeName = "";
    let visitCount = 0;
    let kidsCount = 0;
    let regularCount = 0;

    const card = document.getElementById("card");

    function todayDate() {
      return new Date().toISOString().split("T")[0];
    }

    function render() {
      const { step, phone, name, loading, error } = state;

      if (step === "phone") {
        card.innerHTML = `
          <h1>My Check-In</h1>
          <p>Welcome! કૃપા કરી તમારો ફોન નંબર દાખલ કરો.</p>
          <form id="phoneForm">
            <input type="tel" placeholder="Phone number" value="${phone}" required />
            <button type="submit" ${loading ? "disabled" : ""}>
              ${loading ? "Checking..." : "Continue"}
            </button>
          </form>
          ${error ? `<p class="error">${error}</p>` : ""}
          <button class="admin-btn" onclick="loadAdmin()">Admin Dashboard</button>
        `;
        document.getElementById("phoneForm").onsubmit = handlePhoneSubmit;
        document.querySelector("#phoneForm input").oninput = (e) => {
          state.phone = e.target.value;
        };
      }

      if (step === "register") {
        card.innerHTML = `
          <h1>My Check-In</h1>
          <p>કૃપા કરી તમારી વિગતો દાખલ કરો.</p>
          <form id="registerForm">
            <input type="text" placeholder="Full name" value="${name}" required />
            <input type="tel" placeholder="Phone number" value="${phone}" required />

            <input type="number" min="0" placeholder="Kids (0-8 years)" id="kidsCount" required />
            <input type="number" min="0" placeholder="Regular attendees (8+ years)" id="regularCount" required />

            <button type="submit" ${loading ? "disabled" : ""}>
              ${loading ? "Saving..." : "Check In"}
            </button>
          </form>
          ${error ? `<p class="error">${error}</p>` : ""}
        `;
        const inputs = document.querySelectorAll("#registerForm input");
        inputs[0].oninput = (e) => (state.name = e.target.value);
        inputs[1].oninput = (e) => (state.phone = e.target.value);

        document.getElementById("registerForm").onsubmit = handleRegisterSubmit;
      }

      if (step === "welcome") {
        card.innerHTML = `
          <h1>સ્વાગત છે, ${welcomeName}!</h1>
          <p>તમે ફરીથી પરા સભા કાર્યક્રમમાં આવ્યાં — ખૂબ આનંદ થયો.</p>
          <p>તમે અત્યાર સુધી કુલ <strong>${visitCount}</strong> વખત હાજરી આપી છે.</p>
          <p>બાળકો (0–8): <strong>${kidsCount}</strong></p>
          <p>વયસ્ક (8+): <strong>${regularCount}</strong></p>
        `;
      }

      if (step === "thankyou") {
        card.innerHTML = `
          <h1>આભાર!</h1>
          <p>પરા સભા કાર્યક્રમમાં હાજરી આપવા બદલ ખૂબ ખૂબ આભાર.</p>
          <p>તમારું ચેક-ઇન સફળ થયું.</p>
        `;
      }
    }

    async function handlePhoneSubmit(e) {
      e.preventDefault();
      state.loading = true;
      state.error = "";
      render();

      try {
        const { data: attendee, error } = await supabase
          .from("attendees")
          .select("*")
          .eq("phone", state.phone)
          .maybeSingle();

        if (error) {
          state.error = "કોઈ ભૂલ થઈ. ફરી પ્રયાસ કરો.";
          state.loading = false;
          render();
          return;
        }

        if (attendee) {
          // Check if already checked in today
          const { data: todayCheck, error: checkErr } = await supabase
            .from("checkins")
            .select("*")
            .eq("attendee_id", attendee.id)
            .eq("checkin_date", todayDate())
            .maybeSingle();

          if (todayCheck) {
            state.step = "thankyou";
            card.innerHTML = `
              <h1>આભાર!</h1>
              <p>તમે આજે પહેલેથી જ ચેક-ઇન કરી દીધું છે.</p>
            `;
            return;
          }

          // Not checked in today → allow check-in
          welcomeName = attendee.name;
          kidsCount = attendee.kids_count;
          regularCount = attendee.regular_count;

          // Update visit count
          await supabase
            .from("attendees")
            .update({
              visit_count: attendee.visit_count + 1,
              last_visit: new Date().toISOString()
            })
            .eq("id", attendee.id);

          visitCount = attendee.visit_count + 1;

          // Insert into checkins table
          await supabase.from("checkins").insert({
            attendee_id: attendee.id,
            checkin_date: todayDate(),
            kids_count: attendee.kids_count,
            regular_count: attendee.regular_count
          });

          state.step = "welcome";
        } else {
          state.step = "register";
        }
      } catch (err) {
        state.error = "Unexpected error.";
      }

      state.loading = false;
      render();
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      state.loading = true;
      state.error = "";
      render();

      try {
        const kids = parseInt(document.getElementById("kidsCount").value);
        const regular = parseInt(document.getElementById("regularCount").value);

        const { data: attendee, error } = await supabase
          .from("attendees")
          .insert({
            name: state.name,
            phone: state.phone,
            kids_count: kids,
            regular_count: regular
          })
          .select()
          .single();

        if (error) {
          state.error = "Could not register.";
          state.loading = false;
          render();
          return;
        }

        // Insert today's check-in
        await supabase.from("checkins").insert({
          attendee_id: attendee.id,
          checkin_date: todayDate(),
          kids_count: kids,
          regular_count: regular
        });

        state.step = "thankyou";
      } catch (err) {
        state.error = "Unexpected error.";
      }

      state.loading = false;
      render();
    }

    async function loadAdmin() {
      const pass = prompt("Enter admin password:");
      if (pass !== "satpurush2024") {
        alert("Unauthorized");
        return;
      }

      const { data, error } = await supabase
        .from("checkins")
        .select("*, attendees(name, phone, visit_count)")
        .order("checkin_date", { ascending: false });

      if (error) {
        card.innerHTML = "<p>Error loading admin dashboard.</p>";
        return;
      }

      let html = `
        <h1>Admin Dashboard</h1>
        <p>Total check-ins: ${data.length}</p>

        <button onclick="downloadCSVByDate()">Download CSV by Date</button>
        <button onclick="downloadCSVByUser()">Download CSV by User</button>
        <button onclick="downloadCSVAll()">Download Full CSV</button>

        <table>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Visit Count</th>
            <th>Kids</th>
            <th>Regular</th>
          </tr>
      `;

      data.forEach(row => {
        html += `
          <tr>
            <td>${row.checkin_date}</td>
            <td>${row.attendees.name}</td>
            <td>${row.attendees.phone}</td>
            <td>${row.attendees.visit_count}</td>
            <td>${row.kids_count}</td>
            <td>${row.regular_count}</td>
          </tr>
        `;
      });

      html += "</table>";

      card.innerHTML = html;
    }

    function downloadCSV(rows, filename) {
      const csv = [
        ["Date", "Name", "Phone", "Visit Count", "Kids", "Regular"],
        ...rows.map(r => [
          r.checkin_date,
          r.attendees.name,
          r.attendees.phone,
          r.attendees.visit_count,
          r.kids_count,
          r.regular_count
        ])
      ]
        .map(e => e.join(","))
        .join("\n");

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
    }

    async function downloadCSVByDate() {
      const date = prompt("Enter date (YYYY-MM-DD):");
      if (!date) return;

      const { data } = await supabase
        .from("checkins")
        .select("*, attendees(name, phone, visit_count)")
        .eq("checkin_date", date);

      downloadCSV(data, `checkins_${date}.csv`);
    }

    async function downloadCSVByUser() {
      const phone = prompt("Enter phone number:");
      if (!phone) return;

      const { data } = await supabase
        .from("checkins")
        .select("*, attendees(name, phone, visit_count)")
        .eq("attendees.phone", phone);

      downloadCSV(data, `checkins_${phone}.csv`);
    }

    async function downloadCSVAll() {
      const { data } = await supabase
        .from("checkins")
        .select("*, attendees(name, phone, visit_count)");

      downloadCSV(data, `checkins_all.csv`);
    }

    render();
  </script>
</body>
</html>
